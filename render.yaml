services:
  - type: web
    name: journeo-ai-service
    plan: free
    runtime: docker
    dockerfilePath: ./services/ai-service/Dockerfile
    dockerContext: ./services/ai-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:Fl211UECPIUve0ua@db.kznxrujyptofommyozby.supabase.co:5432/ai_db
      - key: JOURNEY_SERVICE_URL
        value: https://journeo-journey-service.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://journeo-analytics-service.onrender.com
      - key: CONNECTORS_SERVICE_URL
        value: https://journeo-platform-connectors-service.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://journeo.yourdomain.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GUARDRAIL_MODE
        value: flag
      - key: ANOMALY_SCAN_INTERVAL_MINUTES
        value: "15"
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: SELF_PING_URL
        value: https://journeo.yourdomain.com
      - key: SELF_PING_ENABLED
        value: "true"
      - key: SELF_PING_INTERVAL_MINUTES
        value: "4"
  - type: web
    name: journeo-journey-service
    plan: free
    runtime: docker
    dockerfilePath: ./services/journey-service/Dockerfile
    dockerContext: ./services/journey-service
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.kznxrujyptofommyozby.supabase.co:5432/journey_db
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ANALYTICS_SERVICE_URL
        value: https://journeo-analytics-service.onrender.com
      - key: CONNECTORS_SERVICE_URL
        value: https://journeo-platform-connectors-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://journeo-ai-service.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://journeo.yourdomain.com
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: AWS_ENDPOINT_URL
        value: ""
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: journey-files
      - key: S3_PUBLIC_ENDPOINT
        value: ""
      - key: S3_PRESIGN_EXPIRY_SECONDS
        value: "600"
      - key: S3_MAX_IMAGE_MB
        value: "25"
      - key: S3_MAX_VIDEO_MB
        value: "200"
      - key: DEMO_DATA_SEED
        value: "false"
  - type: web
    name: journeo-analytics-service
    plan: free
    runtime: docker
    dockerfilePath: ./services/analytics-service/Dockerfile
    dockerContext: ./services/analytics-service
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.kznxrujyptofommyozby.supabase.co:5432/analytics_db
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://journeo.yourdomain.com
      - key: DEMO_DATA_SEED
        value: "false"
  - type: web
    name: journeo-platform-connectors-service
    plan: free
    runtime: docker
    dockerfilePath: ./services/platform-connectors-service/Dockerfile
    dockerContext: ./services/platform-connectors-service
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.kznxrujyptofommyozby.supabase.co:5432/connectors_db
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://journeo.yourdomain.com
  - type: web
    name: journeo-frontend
    plan: free
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_JOURNEY_SERVICE_URL
        value: https://journeo-journey-service.onrender.com
      - key: VITE_ANALYTICS_SERVICE_URL
        value: https://journeo-analytics-service.onrender.com
      - key: VITE_CONNECTORS_SERVICE_URL
        value: https://journeo-platform-connectors-service.onrender.com
      - key: VITE_AI_SERVICE_URL
        value: https://journeo-ai-service.onrender.com
