services:
  - type: web
    name: journeo-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://journeo-frontend.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://journeo-frontend.onrender.com
      - key: EDITOR_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM__MODEL
        value: google/gemma-4-31b-it:free
      - key: STORAGE__DRIVER
        value: auto
      - key: STORAGE__S3_BUCKET
        sync: false
      - key: WORKER__MODE
        value: inprocess
      - key: KEEPALIVE__ENABLED
        value: "true"
      - key: KEEPALIVE__URLS
        value: '["https://journeo-api.onrender.com/health","https://journeo-frontend.onrender.com/"]'
      - key: SEED_ON_START
        value: "false"
  - type: web
    name: journeo-frontend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: API_ORIGIN
        value: https://journeo-api.onrender.com
      - key: API_HOST
        value: journeo-api.onrender.com
