name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: journeo
          POSTGRES_PASSWORD: journeo
          POSTGRES_DB: journeo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U journeo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://journeo:journeo@localhost:5432/journeo
      FRONTEND_ORIGIN: http://127.0.0.1:4173
      PUBLIC_BASE_URL: http://127.0.0.1:4173
      LLM__MODE: mock
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Migrate and start the API
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.modules.journeys.backfill
          nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > ../../api.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8000/health
      - name: Build and serve the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          VITE_API_PROXY=http://127.0.0.1:8000 nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > ../preview.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:4173/
      - name: Seed the Lighthouse campaign
        env:
          API_URL: http://127.0.0.1:8000
        run: node scripts/lhci-seed.mjs
      - name: Run Lighthouse
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx lhci autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/lhci-reports
