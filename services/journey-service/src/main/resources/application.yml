server:
  port: ${PORT:8081}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/journey_db}
    username: ${SPRING_DATASOURCE_USERNAME:journeo}
    password: ${SPRING_DATASOURCE_PASSWORD:journeo_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: ${SPRING_DATASOURCE_INIT_SQL:SET search_path TO public}
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
demo-data-seed: ${DEMO_DATA_SEED:false}
demo-data-reset: ${DEMO_DATA_RESET:false}
analytics-service-url: ${ANALYTICS_SERVICE_URL:http://localhost:8082}
connectors-service-url: ${CONNECTORS_SERVICE_URL:http://localhost:8083}
ai-service-url: ${AI_SERVICE_URL:http://localhost:8084}
internal-service-token: ${INTERNAL_SERVICE_TOKEN:journeo-internal-token-dev}
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
s3:
  bucket: ${S3_BUCKET:journey-files}
  public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:4566/journey-files}
  presign-expiry-seconds: ${S3_PRESIGN_EXPIRY_SECONDS:600}
  max-image-mb: ${S3_MAX_IMAGE_MB:25}
  max-video-mb: ${S3_MAX_VIDEO_MB:200}
